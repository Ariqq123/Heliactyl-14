<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      :root {
        --ice: #38BDF8;
        --slate: #0F172A;
        --silver: #94A3B8;
      }

      .rack {
        fill: var(--slate);
        stroke: var(--silver);
        stroke-width: 3;
        stroke-linejoin: miter;
      }

      .ice-line {
        fill: none;
        stroke: var(--ice);
        stroke-width: 5;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }

      .circuit {
        fill: none;
        stroke: var(--silver);
        stroke-width: 3;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }

      .node {
        fill: var(--silver);
      }
    </style>
  </defs>

