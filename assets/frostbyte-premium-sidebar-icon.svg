<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      :root {
        --navy: #0F172A;
        --gold: #D4AF37;
        --white: #F8FAFC;
        --platinum: #E5E7EB;
      }

      .plane-dark {
        fill: var(--navy);
      }

      .plane-white {
        fill: var(--white);
      }

      .plane-gold {
        fill: var(--gold);
      }

      .edge {
        fill: none;
        stroke: var(--platinum);
        stroke-width: 1.35;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }

      .accent {
        fill: none;
        stroke: var(--gold);
        stroke-width: 1.6;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
    </style>
  </defs>

