<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      :root {
        --ice-blue: #3bb7e8;
        --silver-gray: #9aa7b2;
      }

      .flake {
        fill: none;
        stroke: var(--ice-blue);
        stroke-width: 36;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .facet {
        fill: var(--silver-gray);
      }
    </style>
  </defs>

  <rect width="512" height="512" rx="92" fill="#ffffff"/>

  <g transform="translate(256 256)">
    <line class="flake" x1="-128" y1="0" x2="128" y2="0"/>
    <line class="flake" x1="-64" y1="-110.85" x2="64" y2="110.85"/>
    <line class="flake" x1="-64" y1="110.85" x2="64" y2="-110.85"/>

    <line class="flake" x1="-88" y1="0" x2="-56" y2="-44"/>
    <line class="flake" x1="-88" y1="0" x2="-56" y2="44"/>
    <line class="flake" x1="88" y1="0" x2="56" y2="-44"/>
    <line class="flake" x1="88" y1="0" x2="56" y2="44"/>

    <line class="flake" x1="-44" y1="-76.21" x2="10" y2="-72"/>
    <line class="flake" x1="-44" y1="-76.21" x2="-22" y2="-28"/>
    <line class="flake" x1="44" y1="76.21" x2="-10" y2="72"/>
    <line class="flake" x1="44" y1="76.21" x2="22" y2="28"/>

    <line class="flake" x1="-44" y1="76.21" x2="10" y2="72"/>
    <line class="flake" x1="-44" y1="76.21" x2="-22" y2="28"/>
    <line class="flake" x1="44" y1="-76.21" x2="-10" y2="-72"/>
    <line class="flake" x1="44" y1="-76.21" x2="22" y2="-28"/>

    <circle cx="0" cy="0" r="30" fill="#3bb7e8"/>
    <rect class="facet" x="-182" y="-28" width="34" height="34" rx="6"/>
    <rect class="facet" x="-150" y="52" width="26" height="26" rx="5"/>
    <rect class="facet" x="-116" y="-92" width="22" height="22" rx="4"/>
  </g>
</svg>
