@tailwind base;
@tailwind components;
@tailwind utilities;

@layer components {
  .card {
    @apply bg-white dark:bg-slate-800 border border-gray-200/60 dark:border-slate-700 rounded-3xl shadow-sm;
  }
  .card-muted {
    @apply bg-gray-50 dark:bg-slate-800/50 border border-gray-200/60 dark:border-slate-700 rounded-2xl;
  }
  .input-field {
    @apply w-full rounded-2xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm text-gray-700 dark:text-slate-300 shadow-sm placeholder:text-gray-400 dark:placeholder:text-slate-500;
  }
  .text-heading {
    @apply text-gray-900 dark:text-slate-100;
  }
  .text-body {
    @apply text-gray-700 dark:text-slate-300;
  }
  .text-muted {
    @apply text-gray-500 dark:text-slate-400;
  }
  .text-faint {
    @apply text-gray-400 dark:text-slate-500;
  }
  .label-field {
    @apply text-sm font-medium text-gray-700 dark:text-slate-300;
  }
  .btn-secondary {
    @apply inline-flex items-center rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-6 py-3 text-sm font-medium text-gray-600 dark:text-slate-400 hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors;
  }
}